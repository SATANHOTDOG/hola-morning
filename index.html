<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231e1e1e'/%3E%3Ccircle cx='256' cy='256' r='90' fill='%23ffa726'/%3E%3Cg stroke='%23ffa726' stroke-width='32' stroke-linecap='round'%3E%3Cline x1='256' y1='64' x2='256' y2='112'/%3E%3Cline x1='256' y1='400' x2='256' y2='448'/%3E%3Cline x1='64' y1='256' x2='112' y2='256'/%3E%3Cline x1='400' y1='256' x2='448' y2='256'/%3E%3Cline x1='120' y1='120' x2='154' y2='154'/%3E%3Cline x1='358' y1='358' x2='392' y2='392'/%3E%3Cline x1='120' y1='392' x2='154' y2='358'/%3E%3Cline x1='358' y1='154' x2='392' y2='120'/%3E%3C/g%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='110' fill='%231e1e1e'/%3E%3Ccircle cx='256' cy='256' r='90' fill='%23ffa726'/%3E%3Cg stroke='%23ffa726' stroke-width='32' stroke-linecap='round'%3E%3Cline x1='256' y1='64' x2='256' y2='112'/%3E%3Cline x1='256' y1='400' x2='256' y2='448'/%3E%3Cline x1='64' y1='256' x2='112' y2='256'/%3E%3Cline x1='400' y1='256' x2='448' y2='256'/%3E%3Cline x1='120' y1='120' x2='154' y2='154'/%3E%3Cline x1='358' y1='358' x2='392' y2='392'/%3E%3Cline x1='120' y1='392' x2='154' y2='358'/%3E%3Cline x1='358' y1='154' x2='392' y2='120'/%3E%3C/g%3E%3C/svg%3E" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOLA大墩 晨會靈魂超度儀表板 v4.2</title>
    <style>
        /* --- 螢幕操作介面 --- */
        body { font-family: "Microsoft JhengHei", sans-serif; background-color: #1e1e1e; color: #d4d4d4; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #2d2d2d; padding: 20px; border-radius: 10px; border-top: 5px solid #007acc; margin-bottom: 20px;}
        h2 { text-align: center; color: #569cd6; margin-top: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 15px; }
        .section-title { grid-column: 1 / -1; margin-top: 10px; border-bottom: 1px solid #444; padding-bottom: 5px; color: #c586c0; font-weight: bold; }
        label { display: block; font-size: 12px; margin-bottom: 2px; color: #9cdcfe; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; background: #1e1e1e; border: 1px solid #3c3c3c; color: #d4d4d4; border-radius: 4px; }
        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; color: white;}
        .btn-submit { background: #007acc; }
        .btn-print { background: #4CAF50; }
        .btn-load { background: #d7ba7d; color: black; }
        .btn-sync { background: #569cd6; color: white; }
        .control-panel { background: #252526; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #3c3c3c; }

        /* --- A4 實體預覽與列印專用樣式 --- */
        #print-preview-area { display: none; }
        
        @media print {
            body { background: none; color: black; padding: 0; margin: 0; }
            .no-print { display: none !important; }
            #print-preview-area { display: block !important; }
            @page { size: A4; margin: 8mm 10mm; }

            .a4-page {
                width: 190mm;
                height: 281mm;
                margin: 0 auto;
                position: relative;
                page-break-after: always;
                box-sizing: border-box;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
            }

            .half-sheet {
                height: 135mm;
                position: relative;
                box-sizing: border-box;
            }

            .fake-table {
                width: 100%;
                border-collapse: collapse;
                border: 2px solid black;
                color: black;
                font-family: "Microsoft JhengHei", sans-serif;
                font-size: 13px;
                background: white;
            }
            .fake-table td, .fake-table th {
                border: 1px solid black;
                padding: 5px 8px;
                text-align: center;
                height: 28px;
            }
            .fake-table .note-row td {
                text-align: left;
                height: 32px;
                font-size: 13px;
                color: blue;
                font-family: 'Kaiti', '標楷體', serif;
            }
            .header-row {
                text-align: left !important;
                padding-left: 15px !important;
                font-size: 14px;
                height: 32px !important;
            }
            .val-text {
                color: blue;
                font-family: 'Kaiti', '標楷體', serif;
                font-weight: bold;
            }
        }

        .preview-screen-box {
            background: white;
            color: black;
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
            border-radius: 5px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .screen-sheet {
            border: 1px dashed #ccc;
            padding: 10px;
            margin-bottom: 20px;
        }
        .screen-sheet h3 { margin: 0 0 10px 0; color: #666; font-size: 14px; }
    </style>
</head>
<body>

<!-- 控制台與輸入介面 -->
<div class="container no-print">
    <h2>HOLA 早午會資料發射器 </h2>
    
    <div class="control-panel">
        <div style="font-weight: bold; margin-bottom: 8px; color: #d7ba7d;">☁️ 雲端歷史資料同步中心</div>
        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <button class="btn-sync" onclick="fetchCloudHistory()">🔄 從 Google 試算表同步最新資料</button>
        </div>
        <div style="display: flex; gap: 10px;">
            <select id="historyList" style="flex: 2;"><option value="">-- 請先點上方按鈕同步資料 --</option></select>
            <button class="btn-load" onclick="loadHistoryData()">載入選取紀錄</button>
        </div>
    </div>

    <div class="grid">
        <div class="section-title">時空與環境</div>
        <div><label>年(ex:115)</label><input type="text" id="year" value="115"></div>
        <div><label>月</label><input type="text" id="month"></div>
        <div><label>日</label><input type="text" id="day"></div>
        <div><label>星期</label><input type="text" id="weekday"></div>
        <div><label>天氣</label><input type="text" id="weather"></div>

        <div class="section-title">殘酷業績區</div>
        <div><label>昨日業績 (萬)</label><input type="text" id="sales"></div>
        <div><label>來客數</label><input type="text" id="visitors"></div>
        <div><label>客單價</label><input type="text" id="avg_price"></div>

        <div class="section-title">達成率大逃殺 (%)</div>
        <div><label>日達成率</label><input type="text" id="rate_day"></div>
        <div><label>大盤日</label><input type="text" id="market_day"></div>
        <div><label>週達成率</label><input type="text" id="rate_week"></div>
        <div><label>大盤週</label><input type="text" id="market_week"></div>
        <div><label>月達成率</label><input type="text" id="rate_month"></div>
        <div><label>大盤月</label><input type="text" id="market_month"></div>
        <div><label>季達成率</label><input type="text" id="rate_quarter"></div>
        <div><label>大盤季</label><input type="text" id="market_quarter"></div>

        <div class="section-title">宣達事項</div>
        <div style="grid-column: 1 / -1;"><input type="text" id="note1" placeholder="第一行..."></div>
        <div style="grid-column: 1 / -1;"><input type="text" id="note2" placeholder="第二行..."></div>
        <div style="grid-column: 1 / -1;"><input type="text" id="note3" placeholder="第三行..."></div>
        <div style="grid-column: 1 / -1;"><input type="text" id="note4" placeholder="第四行..."></div>
        <div style="grid-column: 1 / -1;"><input type="text" id="note5" placeholder="第五行..."></div>
    </div>

    <div class="btn-group">
        <button class="btn-submit" onclick="submitData()">發送至雲端資料庫</button>
    </div>
</div>

<!-- 雙日拼接選擇控制台 -->
<div class="container no-print" style="border-top-color: #4CAF50;">
    <h2>🖨️ A4 雙日智慧套印控制台</h2>
    <div class="grid">
        <div>
            <label>【上半部】選擇日期</label>
            <select id="selectTopDate" onchange="updatePreview()"><option value="">-- 請先同步雲端資料 --</option></select>
        </div>
        <div>
            <label>【下半部】選擇日期</label>
            <select id="selectBottomDate" onchange="updatePreview()"><option value="">-- 請先同步雲端資料 --</option></select>
        </div>
    </div>
    
    <div class="preview-screen-box">
        <div class="screen-sheet">
            <h3>🖥️ A4 上半部預覽</h3>
            <div id="screen-preview-top">（尚未選擇資料）</div>
        </div>
        <div class="screen-sheet">
            <h3>🖥️ A4 下半部預覽</h3>
            <div id="screen-preview-bottom">（尚未選擇資料）</div>
        </div>
    </div>

    <button class="btn-print" onclick="window.print()" style="width: 100%; padding: 15px; font-size: 18px;">🖨️ 確認無誤，開始列印精準 A4 版面</button>
</div>

<!-- 實際列印輸出的 A4 畫布 -->
<div id="print-preview-area">
    <div class="a4-page">
        <div class="half-sheet" id="print-slot-top"></div>
        <div class="half-sheet" id="print-slot-bottom"></div>
    </div>
</div>

<script>
    const fields = ['year', 'month', 'day', 'weekday', 'weather', 'sales', 'visitors', 'avg_price', 'rate_day', 'market_day', 'rate_week', 'market_week', 'rate_month', 'market_month', 'rate_quarter', 'market_quarter', 'note1', 'note2', 'note3', 'note4', 'note5'];
    
    let cloudDataStore = []; // 存放從雲端抓回來的資料陣列
    const apiUrl = "https://script.google.com/macros/s/AKfycbyQGgZ6LC9FKhufestwrqodGNu2ZCHGVClWXb0qYnXopceRvlvQpLXXxB_ymoI9XybAfw/exec";

    // 頁面一開好，自動嘗試同步雲端
    window.onload = function() {
        fetchCloudHistory();
    };

    function getCurrentFormData() {
        let data = {};
        fields.forEach(f => data[f] = document.getElementById(f).value);
        return data;
    }

    function setFormData(data) {
        fields.forEach(f => {
            if(document.getElementById(f)) document.getElementById(f).value = data[f] || '';
        });
    }

    // 從 Google 試算表同步歷史資料
    function fetchCloudHistory() {
        const syncBtn = document.querySelector('.btn-sync');
        syncBtn.innerText = "🔄 正在同步雲端資料...";
        
        fetch(apiUrl)
        .then(res => res.json())
        .then(data => {
            cloudDataStore = data;
            populateDropdowns(data);
            syncBtn.innerText = "🔄 從 Google 試算表同步最新資料 (同步成功！)";
            setTimeout(() => { syncBtn.innerText = "🔄 從 Google 試算表同步最新資料"; }, 3000);
        })
        .catch(err => {
            console.error(err);
            syncBtn.innerText = "❌ 同步失敗 (請檢查網路或 GAS)";
        });
    }

    // 填入所有下拉選單
    function populateDropdowns(dataList) {
        const historyList = document.getElementById('historyList');
        const selectTop = document.getElementById('selectTopDate');
        const selectBottom = document.getElementById('selectBottomDate');
        
        let optionsHtml = '<option value="">-- 選擇歷史紀錄 --</option>';
        
        dataList.forEach((item, index) => {
            let label = `${item.year || '115'}年${item.month}月${item.day}日 (業績:${item.sales}萬)`;
            optionsHtml += `<option value="${index}">${label}</option>`;
        });

        historyList.innerHTML = optionsHtml;
        selectTop.innerHTML = optionsHtml;
        selectBottom.innerHTML = optionsHtml;
    }

    function loadHistoryData() {
        const index = document.getElementById('historyList').value;
        if(index === "") return;
        setFormData(cloudDataStore[index]);
        alert("歷史資料載入成功！");
    }

    function generateTableHtml(data) {
        if (!data || !data.day) return '<p style="text-align:center; color:#888; padding:20px;">(此格無資料)</p>';
        return `
        <table class="fake-table">
            <tr>
                <td colspan="5" class="header-row">
                    <span class="val-text">${data.year || ''}</span> 年 <span class="val-text">${data.month || ''}</span> 月 <span class="val-text">${data.day || ''}</span> 日 &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 星期：<span class="val-text">${data.weekday || ''}</span> &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; 天氣：<span class="val-text">${data.weather || ''}</span>
                </td>
            </tr>
            <tr>
                <td rowspan="4" style="width: 45px;">昨<br>日<br>業<br>績</td>
                <td style="width: 140px; text-align:left;">大墩店 <span class="val-text">${data.sales || ''}</span> 萬</td>
                <td style="width: 90px;">日達成率</td>
                <td>大墩店 <span class="val-text">${data.rate_day || ''}</span> %</td>
                <td>大盤 <span class="val-text">${data.market_day || ''}</span> %</td>
            </tr>
            <tr>
                <td style="text-align:left;">來客數：<span class="val-text">${data.visitors || ''}</span> 人</td>
                <td>週達成率</td>
                <td>大墩店 <span class="val-text">${data.rate_week || ''}</span> %</td>
                <td>大盤 <span class="val-text">${data.market_week || ''}</span> %</td>
            </tr>
            <tr>
                <td style="text-align:left;">客單價：<span class="val-text">${data.avg_price || ''}</span> 元</td>
                <td>月達成率</td>
                <td>大墩店 <span class="val-text">${data.rate_month || ''}</span> %</td>
                <td>大盤 <span class="val-text">${data.market_month || ''}</span> %</td>
            </tr>
            <tr>
                <td></td>
                <td>季達成率</td>
                <td>大墩店 <span class="val-text">${data.rate_quarter || ''}</span> %</td>
                <td>大盤 <span class="val-text">${data.market_quarter || ''}</span> %</td>
            </tr>
            <tr><td colspan="5" style="letter-spacing: 5px; height: 26px;">宣達事項</td></tr>
            <tr class="note-row"><td colspan="5">${data.note1 || ''}</td></tr>
            <tr class="note-row"><td colspan="5">${data.note2 || ''}</td></tr>
            <tr class="note-row"><td colspan="5">${data.note3 || ''}</td></tr>
            <tr class="note-row"><td colspan="5">${data.note4 || ''}</td></tr>
            <tr class="note-row"><td colspan="5">${data.note5 || ''}</td></tr>
        </table>`;
    }

    function updatePreview() {
        const topIdx = document.getElementById('selectTopDate').value;
        const bottomIdx = document.getElementById('selectBottomDate').value;

        const topData = topIdx !== "" ? cloudDataStore[topIdx] : null;
        const bottomData = bottomIdx !== "" ? cloudDataStore[bottomIdx] : null;

        document.getElementById('screen-preview-top').innerHTML = generateTableHtml(topData);
        document.getElementById('screen-preview-bottom').innerHTML = generateTableHtml(bottomData);

        document.getElementById('print-slot-top').innerHTML = generateTableHtml(topData);
        document.getElementById('print-slot-bottom').innerHTML = generateTableHtml(bottomData);
    }

    function submitData() {
        const btn = document.querySelector('.btn-submit');
        const originalText = btn.innerText;
        btn.innerText = "資料發射中...";
        btn.disabled = true;

        const data = getCurrentFormData();
        const payload = new URLSearchParams();
        fields.forEach(f => payload.append(f, data[f]));

        fetch(apiUrl, { method: "POST", mode: "no-cors", body: payload })
        .then(() => { 
            alert("資料已成功發射至 Google 試算表！"); 
            btn.innerText = originalText; 
            btn.disabled = false; 
            // 發射後自動重新同步一次雲端
            fetchCloudHistory();
        })
        .catch(err => { 
            console.error(err);
            alert("靠杯，雲端連線失敗。"); 
            btn.innerText = originalText; 
            btn.disabled = false; 
        });
    }
</script>
</body>
</html>
